<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55a630" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="dirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c5b36" />
      <stop offset="100%" stop-color="#4c321d" />
    </linearGradient>
  </defs>
  <!-- Background with dark premium gradient -->
  <rect width="512" height="512" rx="100" fill="#0a0c16" />
  <g transform="translate(256, 256) scale(1.6)">
    <!-- 3D Voxel Grass Block -->
    <!-- Top Face (Grass) -->
    <polygon points="0,-60 60,-30 0,0 -60,-30" fill="url(#grass)" />
    <!-- Left Face (Dirt) -->
    <polygon points="-60,-30 0,0 0,60 -60,30" fill="url(#dirt)" opacity="0.9" />
    <!-- Right Face (Dirt shaded) -->
    <polygon points="0,0 60,-30 60,30 0,60" fill="url(#dirt)" opacity="0.75" />
    <!-- Grass details on sides -->
    <polygon points="-60,-30 0,0 -20,10 -30,5 -40,15 -60,-30" fill="url(#grass)" />
    <polygon points="0,0 60,-30 40,-20 30,-25 20,-15 0,0" fill="url(#grass)" />
  </g>
</svg>
